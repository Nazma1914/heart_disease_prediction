<!DOCTYPE html>
<html>

<head>

    <title>Prediction Result</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Prediction Result</h1>

    <h2>
        {{ result }}
    </h2>

    {% if probability is not none %}

    <p>
        Probability:
        {{ probability }}%
    </p>

    {% endif %}

    {% if error %}

    <p>
        {{ error }}
    </p>

    {% endif %}

    <a href="/">
        Try Again
    </a>

</div>

</body>

</html>
